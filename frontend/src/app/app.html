<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-navbar />

  @if (identity.error(); as err) {
    <div class="mx-auto mt-8 max-w-2xl px-4">
      <div class="rounded-2xl border border-red-200 bg-red-50 p-6 text-center">
        <h2 class="text-base font-semibold text-red-900">Connection Error</h2>
        <p class="mt-1 text-sm text-red-700">{{ err }}</p>
        <button
          type="button"
          (click)="identity.initialize()"
          class="mt-4 rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700"
        >
          Retry
        </button>
      </div>
    </div>
  } @else {
    <main>
      <router-outlet />
    </main>
  }
</div>
